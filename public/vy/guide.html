<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Guide</title>
  <link rel="icon" href="data:," />
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; } canvas { display: block; }</style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    } }
  </script>
</head>
<body>
<script type="module">
  // A character who lives on top of the page. The orthographic camera maps CSS
  // pixels to the scene with y down, so the parent page places her by screen
  // coordinates: { type: "vy-walk", x, y, gait } moves her feet to (x, y).
  // Screen x is the floor's width and screen y its depth: walking up the page
  // is walking away from the viewer, so she shows her back.
  //
  // Messages in:  vy-config { height }  vy-place { x, y }  vy-walk { x, y, gait }
  //               vy-play { clip }      vy-face { side: "left" | "right" | "front" | "back" }
  // Messages out: vy-ready { gaits }, vy-arrived, vy-clip-done { clip }
  import * as THREE from "three";
  import { loadVrm, CLIPS, MotionPlayer, applySample, Life, clipDuration, loadMotions, gaitSpeed } from "/vy/vy-core.js";

  const MODEL = new URLSearchParams(location.search).get("model");
  if (!MODEL) throw new Error("guide.html requires a ?model=<avatar id> parameter");
  // Gaits she can travel with. A backward gait faces away from the direction of travel.
  const GAITS = { walk: {}, walkHappy: {}, walkCatwalk: {}, strut: {}, sneak: {}, run: {}, runHappy: {}, jog: {}, slideWalk: {}, walkBackward: { backward: true } };
  const FACE = { front: 0, right: Math.PI / 2, back: Math.PI, left: -Math.PI / 2 };
  const TURN_RATE = 9;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio, 1.5), 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.append(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(0, 1, 0, 1, -50, 50);
  const key = new THREE.DirectionalLight(0xffffff, Math.PI * 0.9);
  key.position.set(0.6, 1.6, 2.4);
  scene.add(key, new THREE.AmbientLight(0xffffff, 0.45));

  addEventListener("resize", () => renderer.setSize(innerWidth, innerHeight));
  renderer.setSize(innerWidth, innerHeight);

  const [vrm] = await Promise.all([loadVrm(renderer, `/avatars/${MODEL}.vrm`), loadMotions(Object.keys(GAITS))]);
  const rig = new THREE.Group();
  rig.add(vrm.scene);
  scene.add(rig);
  const hipsRest = vrm.humanoid.getNormalizedBoneNode("hips").position.clone();
  const facing0 = vrm.scene.rotation.y;
  vrm.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const modelHeight = box.max.y - box.min.y;
  // Metres per second for each gait, measured from the clip itself.
  const speed = Object.fromEntries(Object.keys(GAITS).map((g) => [g, gaitSpeed(vrm, g, hipsRest)]));

  const state = { x: -9999, y: 0, tx: 0, ty: 0, gait: null, heightPx: 300, turn: 0, turnTarget: 0 };
  const player = new MotionPlayer("idle", hipsRest.y);
  const life = new Life();
  const clock = new THREE.Clock();
  const post = (msg) => parent.postMessage(msg, location.origin);
  player.onFinish((clip) => post({ type: "vy-clip-done", clip }));
  const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));

  async function handle(m) {
    const now = clock.elapsedTime;
    if (m.type === "vy-config") state.heightPx = m.height;
    if (m.type === "vy-place") { state.x = state.tx = m.x; state.y = state.ty = m.y; }
    if (m.type === "vy-walk") {
      if (!GAITS[m.gait]) throw new Error(`Unknown gait ${m.gait}`);
      state.tx = m.x; state.ty = m.y;
      const dx = state.tx - state.x, dy = state.ty - state.y;
      if (Math.hypot(dx, dy) < 2) { post({ type: "vy-arrived" }); return; }
      state.gait = m.gait;
      state.turnTarget = Math.atan2(dx, dy) + (GAITS[m.gait].backward ? Math.PI : 0);
      player.play(m.gait, now, { fade: 0.2 });
    }
    if (m.type === "vy-play") {
      await loadMotions([m.clip]);
      if (!CLIPS[m.clip]) throw new Error(`Unknown clip ${m.clip}`);
      player.play(m.clip, clock.elapsedTime);
      if (CLIPS[m.clip].hold) setTimeout(() => post({ type: "vy-clip-done", clip: m.clip }), clipDuration(CLIPS[m.clip]) * 1000);
    }
    if (m.type === "vy-face") {
      if (!(m.side in FACE)) throw new Error(`Unknown side ${m.side}`);
      state.turnTarget = FACE[m.side];
    }
  }
  addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    handle(e.data).catch((err) => post({ type: "vy-error", message: err.message }));
  });

  let springsReady = false;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 1 / 30);
    const now = clock.elapsedTime;
    const ppm = state.heightPx / modelHeight;
    if (state.gait) {
      const dx = state.tx - state.x, dy = state.ty - state.y;
      const dist = Math.hypot(dx, dy);
      const step = speed[state.gait] * ppm * dt;
      if (dist <= step) {
        state.x = state.tx; state.y = state.ty;
        state.gait = null;
        state.turnTarget = FACE.front;
        player.play("idle", now, { fade: 0.25 });
        post({ type: "vy-arrived" });
      } else {
        state.x += (dx / dist) * step; state.y += (dy / dist) * step;
      }
    }
    state.turn += wrapAngle(state.turnTarget - state.turn) * Math.min(1, dt * TURN_RATE);

    const s = player.sample(now);
    applySample(vrm, s, hipsRest);
    life.apply(vrm, now);
    vrm.scene.rotation.y = facing0 + state.turn + s.turn;

    // The character stays at true scale so spring bones simulate in metres;
    // the camera is scaled instead, at heightPx CSS pixels per body height.
    camera.left = 0; camera.right = innerWidth / ppm; camera.top = 0; camera.bottom = -innerHeight / ppm;
    camera.updateProjectionMatrix();
    rig.position.set(state.x / ppm, -state.y / ppm - box.min.y, 0);
    if (!springsReady) {
      vrm.scene.updateMatrixWorld(true);
      vrm.springBoneManager?.reset();
      springsReady = true;
    }
    vrm.update(dt);
    renderer.render(scene, camera);
  });
  post({ type: "vy-ready", gaits: Object.keys(GAITS) });
</script>
</body>
</html>
